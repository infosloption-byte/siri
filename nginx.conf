server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Proxy contact form submissions to the mail API sidecar container
    location /api/ {
        proxy_pass http://ycusriya_api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: let React Router handle all routes,
    # so /work/some-slug works on direct load / refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
